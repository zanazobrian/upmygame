<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siphosethu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #ebe1e9;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #a728a1;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #862188;
    }

    /* Popup Background */
    .popup {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.179);
    }

    /* Popup Box */
    .popup-content {
      background-color: rgb(198, 180, 200);
      margin: 15% auto;
      padding: 30px;
      width: 300px;
      border-radius: 10px;
      text-align: center;
      animation: pop 0.4s ease;
    }

    .popup-content h2 {
      color: #bcdf0c;
    }

    .close {
      float: right;
      font-size: 24px;
      cursor: pointer;
      color: red;
    }

    @keyframes pop {
      from {
        transform: scale(0.5);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <button onclick="showPopup()">Game on!!</button>

  <!-- Popup -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <span class="close" onclick="closePopup()">&times;</span>
      <h2> Inspired by you</h2>
      <p>You are gorgouesly charming</p>
    </div>
  </div>

  <script>
    function showPopup() {
      document.getElementById("popup").style.display = "block";
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
  </script>

</body>
</html>
